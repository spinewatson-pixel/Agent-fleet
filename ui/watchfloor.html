<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0b0a14">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>watchfloor org — quant lab</title>
<style>
:root{
--bg:#0b0a14;--card:#131120;--card2:#181528;--border:#2b2743;--border2:#3a3560;
--purple:#8b7cf6;--purple-hi:#9a8df8;--purple-grad:linear-gradient(160deg,#9a8ff5 0%,#7f72ee 100%);
--ink:#e8e6f5;--ink-dim:#b9b3e0;--ink-mute:#6f6a94;--green:#4ade80;--red:#ef4444;--yellow:#facc15;
--mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0b0a14!important;color:var(--ink);font-family:var(--sans);min-height:100%}
body{min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:0 14px 90px;position:relative;z-index:1}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:
radial-gradient(600px 300px at 50% -80px, rgba(139,124,246,.14), transparent 70%),
radial-gradient(500px 400px at 90% 60%, rgba(139,124,246,.05), transparent 70%)}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(11,10,20,.97) 72%,rgba(11,10,20,0));padding:14px 0 8px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.02em}
.brand h1 span{color:var(--purple-hi)}
.brand .live{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--green)}
.brand .live::before{content:'●';margin-right:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--ink-dim);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-left:6px}
.tab.on{background:var(--purple-grad);border-color:transparent;color:#fff}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:9px 13px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13.5px}
.hint{margin-top:7px;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-mute)}
.banner{margin-top:14px;border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--card)}
.banner-head{background:var(--purple-grad);padding:24px 18px;text-align:center}
.banner-head h2{color:#fff;font-size:22px;font-weight:900;letter-spacing:.06em}
.banner-body{padding:16px 18px 18px;text-align:center}
.banner-body p{color:var(--ink-dim);font-size:14.5px;line-height:1.55;margin-bottom:13px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);border:1px solid var(--border2);border-radius:9px;padding:7px 12px;background:rgba(139,124,246,.05)}
.pill.green{color:var(--green);border-color:rgba(74,222,128,.4)}
.qstats{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:18px;overflow:hidden}
.qs{padding:15px 16px;background:var(--card)}
.qs:nth-child(odd){border-right:1px solid var(--border)}
.qs:nth-child(n+3){border-top:1px solid var(--border)}
.qs .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:6px}
.qs .v{font-size:21px;font-weight:850}
.qs .v.grn{color:var(--green)}
.dept{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card);margin-top:12px}
.dept-head{background:var(--purple-grad);padding:15px 44px;cursor:pointer;position:relative;user-select:none}
.dept-head h3{color:#fff;font-size:16px;font-weight:850;letter-spacing:.04em;text-align:center}
.dept-head .sub{display:block;text-align:center;color:rgba(255,255,255,.85);font-family:var(--mono);font-size:10px;letter-spacing:.18em;margin-top:4px}
.dept-head .car{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:12px}
.dept.open .dept-head .car{transform:translateY(-50%) rotate(180deg)}
.dept-desc{padding:12px 16px 4px;color:var(--ink-dim);font-size:13.5px;line-height:1.5}
.dept-pills{padding:10px 16px 13px;display:flex;flex-wrap:wrap;gap:7px}
.dept-body{display:none;padding:2px 12px 14px}
.dept.open .dept-body{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:460px){.grid{grid-template-columns:1fr 1fr 1fr}}
.agent{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card2);cursor:pointer;display:flex;flex-direction:column;aspect-ratio:1/1.02}
.agent:hover{border-color:var(--purple)}
.agent-head{background:var(--purple-grad);padding:12px 8px 10px;text-align:center}
.agent-head .nm{color:#fff;font-weight:850;font-size:13px;letter-spacing:.03em;word-break:break-word}
.agent-head .nick{color:rgba(255,255,255,.82);font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;margin-top:4px;text-transform:uppercase}
.agent-mid{flex:1;padding:9px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--ink-dim);border:1px solid var(--border2);border-radius:7px;padding:4px 7px;text-transform:uppercase}
.tag.g{color:var(--green);border-color:rgba(74,222,128,.4)}
.agent-foot{padding:7px 10px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-mute);text-transform:uppercase}
.agent-foot .dot{color:var(--green);margin-right:5px}
.agent-foot.standby .dot{color:var(--yellow)}
.agent-foot.human .dot{color:var(--purple-hi)}
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
.ov.on{display:block}
.ov-in{max-width:520px;margin:0 auto;padding:16px 14px 80px}
.ov-top{display:flex;gap:13px;align-items:flex-start}
.ov-name{font-size:22px;font-weight:900;letter-spacing:.04em;margin-bottom:8px;word-break:break-word}
.ov-x{margin-left:auto;width:44px;height:44px;border-radius:14px;border:1px solid var(--border2);background:var(--card2);color:var(--purple-hi);font-size:16px;display:grid;place-items:center;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;border:1px solid var(--border2);border-radius:10px;padding:7px 11px;color:var(--ink-dim)}
.badge.run{color:var(--green);border-color:rgba(74,222,128,.45)}
.box{margin-top:14px;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:16px}
.box .k{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:9px}
.box .v{font-size:15px;line-height:1.55}
.conn{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.conn .line{width:2px;height:18px;background:var(--border2)}
.conn .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-dim);border:1px solid var(--border2);border-radius:999px;padding:8px 16px;background:var(--bg);text-align:center}
.ovw{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card);cursor:pointer;margin-top:10px}
.ovw-head{background:var(--purple-grad);padding:14px 16px;display:flex;align-items:center;gap:11px}
.ovw-head h3{color:#fff;font-size:15px;font-weight:850;flex:1}
.ovw-body{padding:12px 16px 14px}
.ovw-body p{color:var(--ink-dim);font-size:13px;line-height:1.5}
.empty{padding:26px 10px;text-align:center;color:var(--ink-mute);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;background:var(--card2);border:1px solid var(--border2);color:var(--ink-dim);font-size:12.5px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

function byDivision(){
  const map={};
  REG.agents.forEach(a=>{
    if(!map[a.division]) map[a.division]={};
    if(!map[a.division][a.department]) map[a.division][a.department]=[];
    map[a.division][a.department].push(a);
  });
  return map;
}
const DIVS=byDivision();
let cur='home';
let toastT;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/"/g,'&quot;')}

function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  const mk=(label,key,n)=>{
    const b=document.createElement('button');
    b.className='tab'+(cur===key?' on':'');
    b.innerHTML=label+(n!=null?` <span class="n">${n}</span>`:'');
    b.onclick=()=>{cur=key;document.getElementById('q').value='';render()};
    el.appendChild(b);
  };
  mk('Overview','home',REG.counts.total_agents);
  mk('Authority','authority');
  Object.keys(DIV_META).forEach(k=>{
    const n=REG.agents.filter(a=>a.division===k).length;
    if(n) mk(`${DIV_META[k].em} ${DIV_META[k].tab}`,k,n);
  });
}

function agentCard(a){
  const st=a.status==='RUNNING'?'':(a.status==='HUMAN'?'human':'standby');
  const tags=(a.tags||[]).slice(0,3).map((t,i)=>`<span class="tag${i===0&&String(t).includes('PAPER')?' g':''}">${esc(t)}</span>`).join('');
  const propose=a.may_propose_trades?'<span class="tag g">PROPOSE</span>':'';
  return `<div class="agent" data-id="${esc(a.id)}"><div class="agent-head"><div class="nm">${esc(a.id)}</div><div class="nick">“${esc(a.nick)}”</div></div><div class="agent-mid">${tags}${propose}</div><div class="agent-foot ${st}"><span class="dot">●</span>${esc(a.status||'RUNNING')}</div></div>`;
}

function openAgent(id){
  const a=REG.agents.find(x=>x.id===id); if(!a) return;
  const html=`<div class="ov-top"><div style="flex:1;min-width:0"><div class="ov-name">${esc(a.id)}</div>
    <div class="badges"><span class="badge run">${esc(a.status||'RUNNING')}</span>
    <span class="badge">${esc(a.kind||'')}</span>
    ${a.may_propose_trades?'<span class="badge" style="color:var(--green);border-color:rgba(74,222,128,.45)">MAY PROPOSE</span>':''}
    ${a.may_place_orders?'<span class="badge" style="color:var(--yellow);border-color:rgba(250,204,21,.4)">EXEC PAPER</span>':''}
    </div></div><div class="ov-x" id="ovX">✕</div></div>
    <div class="box"><div class="k">Nickname</div><div class="v">${esc(a.nick)}</div></div>
    <div class="box"><div class="k">Mandate</div><div class="v">${esc(a.role)}</div></div>
    <div class="box"><div class="k">Division · Department · Supervisor</div><div class="v">${esc(a.division)} · ${esc(a.department)}<br><span style="color:var(--ink-mute)">Supervisor ${esc(a.supervisor_id||'—')}</span></div></div>
    <div class="box"><div class="k">Permissions</div><div class="v">propose=${a.may_propose_trades} · execute=${!!a.may_place_orders} · self_approve=${!!a.can_self_approve} · paper_only=${a.paper_only!==false}</div></div>
    <div class="box"><div class="k">Tags</div><div class="v">${(a.tags||[]).map(esc).join(' · ')}</div></div>`;
  document.getElementById('ovIn').innerHTML=html;
  document.getElementById('ov').classList.add('on');
  document.getElementById('ovX').onclick=()=>document.getElementById('ov').classList.remove('on');
}

function renderHome(){
  const rules=REG.hard_rules;
  let out=`<div class="banner"><div class="banner-head"><h2>WATCHFLOOR QUANT LAB</h2></div>
    <div class="banner-body"><p>Institutional paper-trading organization. Agents propose; risk/governance veto; EXEC-1 alone places authorized paper orders. Live execution remains disabled.</p>
    <div class="pillrow"><span class="pill green">PAPER SANDBOX</span><span class="pill">CEILING ${rules.agent_ceiling}</span><span class="pill">LIVE OFF</span></div></div></div>`;
  out+=`<div class="qstats">
    <div class="qs"><div class="k">Total Agents</div><div class="v">${REG.counts.total_agents}</div></div>
    <div class="qs"><div class="k">Proposers</div><div class="v grn">${REG.counts.proposers}</div></div>
    <div class="qs"><div class="k">Divisions</div><div class="v">${REG.counts.divisions}</div></div>
    <div class="qs"><div class="k">Executors</div><div class="v">EXEC-1</div></div></div>`;
  out+=`<div class="conn"><div class="line"></div><div class="lbl">DIVISIONS</div><div class="line"></div></div>`;
  Object.keys(DIV_META).forEach(k=>{
    const n=REG.agents.filter(a=>a.division===k).length;
    if(!n) return;
    const m=DIV_META[k];
    out+=`<div class="ovw" data-go="${k}"><div class="ovw-head"><span>${m.em}</span><h3>${m.name}</h3><span style="color:#fff">›</span></div>
      <div class="ovw-body"><p>${m.desc}</p><div class="pillrow" style="justify-content:flex-start;margin-top:10px"><span class="pill green">${n} AGENTS</span><span class="pill">${m.label}</span></div></div></div>`;
  });
  document.getElementById('view').innerHTML=out;
  document.querySelectorAll('.ovw').forEach(el=>el.onclick=()=>{cur=el.getAttribute('data-go');render()});
}

function renderAuthority(){
  let out=`<div class="banner"><div class="banner-head"><h2>AUTHORITY MAP</h2></div>
    <div class="banner-body"><p>Strategy agents propose only. Binding size and approval live outside proposers.</p></div></div>`;
  out+=`<div class="box"><div class="k">Approval Chain</div><div class="v">${REG.approval_chain.join(' → ')}</div></div>`;
  out+=`<div class="box"><div class="k">Veto Agents</div><div class="v">${REG.veto_agents.join(' · ')}</div></div>`;
  out+=`<div class="box"><div class="k">Institutional Council → Watchfloor Seats</div><div class="v">`+
    Object.entries(REG.institutional_council_map).map(([k,v])=>`<div style="margin-bottom:10px"><b style="color:var(--purple-hi)">${esc(k)}</b><br>${v.map(esc).join(', ')}</div>`).join('')+
    `</div></div>`;
  out+=`<div class="box"><div class="k">Hard Rules</div><div class="v"><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:11px;color:var(--ink-dim)">${esc(JSON.stringify(REG.hard_rules,null,2))}</pre></div></div>`;
  document.getElementById('view').innerHTML=out;
}

function renderDivision(key){
  const m=DIV_META[key]; const q=document.getElementById('q').value.trim().toLowerCase();
  const depts=DIVS[key]||{};
  let out=`<div class="banner"><div class="banner-head"><h2>${m.em} ${m.name}</h2></div>
    <div class="banner-body"><p>${m.desc}</p><div class="pillrow"><span class="pill">${m.label}</span></div></div></div>`;
  Object.keys(depts).forEach((deptName,i)=>{
    let agents=depts[deptName];
    if(q) agents=agents.filter(a=>(a.id+' '+a.nick+' '+(a.tags||[]).join(' ')).toLowerCase().includes(q));
    if(q && !agents.length) return;
    out+=`<div class="dept open" data-di="${i}">
      <div class="dept-head"><h3>${esc(deptName)}</h3><span class="sub">${agents.length} AGENTS</span><span class="car">▾</span></div>
      <div class="dept-pills"><span class="pill green">${agents.length} AGENTS</span></div>
      <div class="dept-body"><div class="grid">${agents.map(agentCard).join('')}</div></div></div>`;
  });
  if(out.indexOf('dept')<0) out+=`<div class="empty">No agents match.</div>`;
  document.getElementById('view').innerHTML=out;
  document.querySelectorAll('.dept-head').forEach(hd=>hd.onclick=()=>hd.parentElement.classList.toggle('open'));
  document.querySelectorAll('.agent').forEach(c=>c.onclick=()=>openAgent(c.getAttribute('data-id')));
}

function render(){
  renderTabs();
  if(cur==='home') return renderHome();
  if(cur==='authority') return renderAuthority();
  if(DIV_META[cur]) return renderDivision(cur);
  renderHome();
}
document.getElementById('q').addEventListener('input',render);
render();
