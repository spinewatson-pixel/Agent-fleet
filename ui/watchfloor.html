<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0b0a14">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>watchfloor org — quant lab</title>
<style>
:root{
--bg:#0b0a14;--card:#131120;--card2:#181528;--border:#2b2743;--border2:#3a3560;
--purple:#8b7cf6;--purple-hi:#9a8df8;--purple-grad:linear-gradient(160deg,#9a8ff5 0%,#7f72ee 100%);
--ink:#e8e6f5;--ink-dim:#b9b3e0;--ink-mute:#6f6a94;--green:#4ade80;--red:#ef4444;--yellow:#facc15;
--mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark}
html{background:#0b0a14 !important;min-height:100%}
html,body{background:#0b0a14 !important}
body{min-height:100vh;background-color:#0b0a14 !important}
body::before{content:'';position:fixed;inset:-20vh -20vw;background:#0b0a14;z-index:-2;pointer-events:none}
body{font-family:var(--sans);color:var(--ink);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:0 14px 90px;position:relative}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:
radial-gradient(600px 300px at 50% -80px, rgba(139,124,246,.14), transparent 70%),
radial-gradient(500px 400px at 90% 60%, rgba(139,124,246,.05), transparent 70%)}

.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(11,10,20,.97) 72%,rgba(11,10,20,0));padding:14px 0 8px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.02em}
.brand h1 span{color:var(--purple-hi)}
.brand .live{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--green)}
.brand .live.off{color:var(--yellow)}
.brand .live::before{content:'●';margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:14px;
background:var(--card);border:1px solid var(--border);color:var(--ink-dim);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.tab.on{background:var(--purple-grad);border-color:transparent;color:#fff;box-shadow:0 4px 18px rgba(139,124,246,.35)}
.tab.on .n{color:rgba(255,255,255,.75)}
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:9px 13px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13.5px;font-family:var(--sans)}
.search input::placeholder{color:var(--ink-mute)}
.hint{margin-top:7px;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-mute)}

.banner{margin-top:14px;border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 0 40px rgba(139,124,246,.07)}
.banner-head{background:var(--purple-grad);padding:24px 18px;text-align:center}
.banner-head .em{font-size:26px;display:block;margin-bottom:6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.banner-head h2{color:#fff;font-size:23px;font-weight:900;letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.banner-body{padding:16px 18px 18px;text-align:center}
.banner-body p{color:var(--ink-dim);font-size:14.5px;line-height:1.55;max-width:420px;margin:0 auto 13px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);
border:1px solid var(--border2);border-radius:9px;padding:7px 12px;background:rgba(139,124,246,.05)}
.pill.green{color:var(--green);border-color:rgba(74,222,128,.4)}
.pill.cust{color:var(--purple-hi);border-color:var(--purple)}
.conn{display:flex;flex-direction:column;align-items:center}
.conn .line{width:2px;height:24px;background:var(--border2)}
.conn .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--ink-dim);
border:1px solid var(--border2);border-radius:999px;padding:10px 20px;background:var(--bg);text-align:center}

.dept{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.dept-head{background:var(--purple-grad);padding:15px 44px;cursor:pointer;position:relative;user-select:none}
.dept-head h3{color:#fff;font-size:17px;font-weight:850;letter-spacing:.04em;text-align:center}
.dept-head .sub{display:block;text-align:center;color:rgba(255,255,255,.85);font-family:var(--mono);font-size:10px;letter-spacing:.22em;margin-top:4px}
.dept-head .car{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:10px;
background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:12px;transition:transform .2s}
.dept.open .dept-head .car{transform:translateY(-50%) rotate(180deg)}
.dept-desc{padding:12px 16px 4px;color:var(--ink-dim);font-size:13.5px;line-height:1.5}
.dept-pills{padding:10px 16px 13px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.dept-pills .pill{font-size:10px;padding:6px 10px}
.dept-del{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--red);
border:1px solid rgba(239,68,68,.4);border-radius:8px;padding:6px 10px;background:none;cursor:pointer}
.dept-body{display:none;padding:2px 12px 14px}
.dept.open .dept-body{display:block}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:460px){.grid{grid-template-columns:1fr 1fr 1fr}}
.agent{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card2);cursor:pointer;
display:flex;flex-direction:column;transition:transform .12s,border-color .12s;aspect-ratio:1/1.02}
.agent:active{transform:scale(.97)}
.agent:hover{border-color:var(--purple)}
.agent-head{background:var(--purple-grad);padding:12px 8px 10px;text-align:center}
.agent-head .nm{color:#fff;font-weight:850;font-size:14.5px;letter-spacing:.03em;line-height:1.1;word-break:break-word}
.agent-head .nick{color:rgba(255,255,255,.82);font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;margin-top:4px;text-transform:uppercase}
.agent-mid{flex:1;padding:9px 9px 4px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--ink-dim);border:1px solid var(--border2);
border-radius:7px;padding:4px 7px;text-transform:uppercase}
.tag.g{color:var(--green);border-color:rgba(74,222,128,.4)}
.tag.c{color:var(--purple-hi);border-color:var(--purple)}
.agent-foot{padding:7px 10px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-mute);text-transform:uppercase}
.agent-foot .dot{color:var(--green);margin-right:5px}
.agent-foot.standby .dot{color:var(--yellow)}
.agent-foot.human .dot{color:var(--purple-hi)}
.add-agent{border:1.5px dashed var(--border2);border-radius:16px;background:none;aspect-ratio:1/1.02;cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-mute);transition:.15s}
.add-agent:hover{border-color:var(--purple);color:var(--purple-hi)}
.add-agent .plus{font-size:26px;line-height:1}
.add-agent .t{font-family:var(--mono);font-size:9px;letter-spacing:.2em}
.add-dept{margin-top:0;border:1.5px dashed var(--border2);border-radius:20px;background:none;width:100%;padding:20px;
color:var(--ink-mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);
font-size:11px;letter-spacing:.22em;transition:.15s}
.add-dept:hover{border-color:var(--purple);color:var(--purple-hi)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-mute);font-size:13px}

/* detail overlay */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain}
.ov.on{display:block}
.ov-in{max-width:520px;margin:0 auto;padding:16px 14px 130px}
.ov-top{display:flex;gap:13px;align-items:flex-start}
.ov-icon{width:62px;height:62px;border-radius:18px;border:1px solid var(--border2);background:var(--card2);
display:grid;place-items:center;font-size:25px;flex-shrink:0}
.ov-x{margin-left:auto;width:44px;height:44px;border-radius:14px;border:1px solid var(--border2);background:var(--card2);
color:var(--purple-hi);font-size:16px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.ov-name{font-size:22px;font-weight:900;letter-spacing:.04em;margin-bottom:8px;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;border:1px solid var(--border2);border-radius:10px;
padding:7px 11px;color:var(--ink-dim)}
.badge b{color:var(--ink)}
.badge.run{color:var(--green);border-color:rgba(74,222,128,.45)}
.badge.run::before{content:'●';margin-right:6px}
.badge.stb{color:var(--yellow);border-color:rgba(250,204,21,.4)}
.badge.stb::before{content:'●';margin-right:6px}
.tiles{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tile{position:relative;border:1px solid var(--border);border-radius:15px;background:var(--card);padding:14px 4px 11px;
display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.12s}
.tile .em{font-size:19px}
.tile .t{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;text-align:center}
.tile.on{border-color:var(--purple);background:rgba(139,124,246,.1);box-shadow:0 0 14px rgba(139,124,246,.18)}
.tile .bdg{position:absolute;top:-7px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--purple);
color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-family:var(--mono)}
.tile .bdg.red{background:var(--red)}
.tile .bdg.live{top:-8px;right:-6px;background:var(--green);color:#052e12;border-radius:8px;
font-size:8.5px;letter-spacing:.08em;padding:3px 7px;height:auto;font-weight:800}
.panel{margin-top:14px;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:15px 16px;min-height:76px}
.panel .ph{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--ink-mute);margin-bottom:9px;text-transform:uppercase}
.panel .pc{font-size:14px;color:var(--ink-dim);line-height:1.55}
.panel .pc .row{display:flex;gap:8px;margin-bottom:8px}
.panel .pc .row .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-mute);min-width:74px;padding-top:2px;text-transform:uppercase}
.panel .pc .green{color:var(--green)}
.panel .pc .red{color:var(--red)}
.pnote{font-size:12.5px;color:var(--ink-mute);line-height:1.5;margin-bottom:11px}
.pfoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-family:var(--mono);
font-size:9px;letter-spacing:.13em;color:var(--ink-mute);line-height:1.7}
.pli{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border);
border-radius:13px;background:var(--card2);margin-bottom:8px}
.pli .ic{font-size:15px;flex:0 0 auto;width:20px;text-align:center;font-family:var(--mono);color:var(--ink-mute)}
.pli .tx{flex:1;min-width:0}
.pli .tx b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
.pli .tx i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-mute);margin-top:2px;line-height:1.4}
.pli .rt{flex:0 0 auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-dim);
border:1px solid var(--border2);border-radius:7px;padding:5px 8px;white-space:nowrap}
.pli .rt.g{color:var(--green);border-color:rgba(74,222,128,.35)}
.pli .rt.y{color:var(--yellow);border-color:rgba(250,204,21,.35)}
.pli .rt.r{color:var(--red);border-color:rgba(239,68,68,.4)}
.pli.fn{cursor:pointer;user-select:none}
.pli.fn:active{background:rgba(139,124,246,.09)}
.sw{flex:0 0 auto;width:38px;height:22px;border-radius:12px;background:#221f38;border:1px solid var(--border2);position:relative;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-mute);transition:.18s}
.sw.on{background:var(--purple);border-color:var(--purple)}
.sw.on i{left:18px;background:#fff}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mc{border:1px solid var(--border);border-radius:13px;background:var(--card2);padding:13px 12px}
.mc .mk{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase}
.mc .mv{font-size:24px;font-weight:800;color:var(--ink);margin-top:5px;line-height:1}
.mc .mu{font-family:var(--mono);font-size:9.5px;color:var(--ink-mute);margin-top:4px}
.tlx{position:relative;padding-left:6px}
.tli{display:flex;align-items:flex-start;gap:11px;padding:0 0 15px;position:relative}
.tli:not(:last-child)::before{content:'';position:absolute;left:4px;top:13px;bottom:0;width:1px;background:var(--border2)}
.tli .dt{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--border2);margin-top:4px;z-index:1}
.tli.now .dt{background:var(--green);box-shadow:0 0 9px rgba(74,222,128,.6)}
.tli .tt{flex:1;font-size:13px;color:var(--ink-dim);line-height:1.45}
.tli.now .tt{color:var(--green)}
.tli .tm{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-mute);padding-top:2px}
.peers{display:flex;flex-wrap:wrap;gap:7px}
.peer{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-dim);border:1px solid var(--border2);
border-radius:9px;padding:8px 10px;background:rgba(139,124,246,.06);cursor:pointer}
.peer:active{border-color:var(--purple);color:var(--purple-hi)}
.statgrid{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.stat{padding:15px 16px;background:var(--card)}
.stat:nth-child(odd){border-right:1px solid var(--border)}
.stat:nth-child(n+3){border-top:1px solid var(--border)}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:7px}
.stat .v{font-size:16px;font-weight:700;line-height:1.35}
.stat .v.green{color:var(--green);font-size:14.5px;font-weight:600}
.box{margin-top:14px;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:16px}
.box .k{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:9px}
.box .v{font-size:15.5px;line-height:1.55}
.box .v .sm{color:var(--ink-dim);font-size:13.5px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--ink-dim);border:1px solid var(--border2);border-radius:999px;
padding:10px 15px;background:var(--card);cursor:pointer;white-space:nowrap;font-family:var(--sans)}
.chip:active{background:rgba(139,124,246,.12)}
.chip.danger{color:var(--red);border-color:rgba(239,68,68,.4)}
.chatlog{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45}
.msg.you{align-self:flex-end;background:var(--purple-grad);color:#fff;border-bottom-right-radius:4px}
.msg.agt{align-self:flex-start;background:var(--card2);border:1px solid var(--border);color:var(--ink-dim);border-bottom-left-radius:4px}
.msg.agt .who{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--purple-hi);display:block;margin-bottom:4px}
.chatbar{position:fixed;bottom:0;left:0;right:0;z-index:70;background:linear-gradient(0deg,var(--bg) 75%,transparent);padding:10px 14px 18px;display:none}
.chatbar.on{display:block}
.chatbar-in{max-width:520px;margin:0 auto}
.chatrow{display:flex;gap:9px;align-items:center}
.chatrow input{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:999px;padding:14px 18px;
color:var(--ink);font-size:14px;outline:none;font-family:var(--sans)}
.chatrow input::placeholder{color:var(--ink-mute)}
.send{width:52px;height:48px;border-radius:16px;background:var(--purple-grad);border:none;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
.tip{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-mute);margin-top:9px}

/* create modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(11,10,20,.8);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--border2);
border-radius:24px 24px 0 0;padding:0 0 26px}
.sheet-head{background:var(--purple-grad);padding:18px;text-align:center;border-radius:22px 22px 0 0;position:sticky;top:0}
.sheet-head h3{color:#fff;font-size:18px;font-weight:850;letter-spacing:.04em}
.sheet-head .sub{color:rgba(255,255,255,.85);font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;margin-top:4px}
.sheet-body{padding:18px 18px 0}
.fld{margin-bottom:14px}
.fld label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:7px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--card2);border:1px solid var(--border2);border-radius:12px;
padding:12px 14px;color:var(--ink);font-size:14px;outline:none;font-family:var(--sans)}
.fld textarea{min-height:74px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--purple)}
.fld .note{font-size:11.5px;color:var(--ink-mute);margin-top:5px}
.sheet-btns{display:flex;gap:10px;padding:6px 18px 0}
.btn{flex:1;border:none;border-radius:14px;padding:15px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.btn.pri{background:var(--purple-grad);color:#fff}
.btn.sec{background:var(--card2);border:1px solid var(--border2);color:var(--ink-dim)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);z-index:99;background:var(--card2);
border:1px solid var(--border2);color:var(--ink-dim);font-size:12.5px;padding:10px 16px;border-radius:12px;opacity:0;
transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
section.divwrap{position:relative;z-index:1}

/* ===== overview (HQ) ===== */
.qstats{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:18px;overflow:hidden}
.qs{padding:15px 16px;background:var(--card)}
.qs:nth-child(odd){border-right:1px solid var(--border)}
.qs:nth-child(n+3){border-top:1px solid var(--border)}
.qs .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:6px}
.qs .v{font-size:21px;font-weight:850}
.qs .v span{font-size:12px;color:var(--ink-mute);font-weight:600}
.qs .v.grn{color:var(--green)}
.loop{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;align-items:center}
.loop::-webkit-scrollbar{display:none}
.web{border:1px solid var(--border);border-radius:20px;background:var(--card);padding:10px 6px 4px;overflow:hidden}
.web svg{width:100%;height:auto;display:block}
.web line{stroke:var(--purple)}

CUSTOM.agents=CUSTOM.agents.filter(function(x){return x.id!==a.id});
delete CHATS[a.id];saveCustom();saveChats();
applyCustom();cur=DIVISIONS.find(function(d){return d.key===cur.key});
closeAgent();render();toast(a.id+" retired · knowledge extracted to org memory")}

function sheetHTML(title,sub,fields,btn){
return '<div class="sheet-head"><h3>'+title+'</h3><div class="sub">'+sub+'</div></div><div class="sheet-body">'+fields+'</div>'+
'<div class="sheet-btns"><button class="btn sec" id="mCancel">Cancel</button><button class="btn pri" id="mSave">'+btn+'</button></div>'}

function openCreateAgent(deptName){
var depts=cur.depts.map(function(d){return '<option'+(d.name===deptName?" selected":"")+'>'+esc(d.name)+'</option>'}).join("");
var f='<div class="fld"><label>Codename</label><input id="fId" placeholder="e.g. GOLD-1, EARN-SCOUT, SPAIN-WX" style="text-transform:uppercase"><div class="note">Unique ID — shows on the card header.</div></div>'+
'<div class="fld"><label>Nickname</label><input id="fNick" placeholder="e.g. Midas"></div>'+
'<div class="fld"><label>Role / Mandate</label><textarea id="fRole" placeholder="What is this agent responsible for? Be specific — it defines its whole behavior."></textarea></div>'+
'<div class="fld"><label>Tags (comma-separated)</label><input id="fTags" placeholder="PAPER TRADER, GOLD, LONG ONLY"></div>'+
'<div class="fld"><label>Department</label><select id="fDept">'+depts+'</select></div>'+
'<div class="fld"><label>Status</label><select id="fStatus"><option>RUNNING</option><option>ON-DEMAND</option></select></div>';
var sheet=document.getElementById("sheet");sheet.innerHTML=sheetHTML("＋ New Agent",cur.name+" · SAVED TO ORG MEMORY",f,"Create Agent");
document.getElementById("modal").classList.add("on");
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("mSave").onclick=function(){
var id=document.getElementById("fId").value.trim().toUpperCase().replace(/\s+/g,"-");
var nick=document.getElementById("fNick").value.trim()||"Unnamed";
var role=document.getElementById("fRole").value.trim()||"Custom agent — mandate to be defined.";
var tags=document.getElementById("fTags").value.split(",").map(function(t){return t.trim().toUpperCase()}).filter(Boolean);
if(!tags.length)tags=["CUSTOM"];
var dept=document.getElementById("fDept").value;
var status=document.getElementById("fStatus").value;
if(!id){toast("Codename is required");return}
var exists=false;DIVISIONS.forEach(function(dv){dv.depts.forEach(function(dp){dp.agents.forEach(function(ag){if(ag.id===id)exists=true})})});
if(exists){toast("Codename "+id+" already exists");return}
var kindMap={trade:"trader",intel:"intel",pred:"disc",lab:"lab",learn:"meta",data:"data",ctrl:"gov",contr:"contr"};
CUSTOM.agents.push({div:cur.key,dept:dept,id:id,nick:nick,role:role,tags:tags,status:status,kind:kindMap[cur.key]||"trader"});
saveCustom();applyCustom();cur=DIVISIONS.find(function(d){return d.key===cur.key});
closeModal();render();toast(id+" deployed to "+dept)}}

function openCreateDept(){
var f='<div class="fld"><label>Department Name</label><input id="fName" placeholder="e.g. Options Desk, Small Caps"></div>'+
'<div class="fld"><label>Tagline</label><input id="fSub" placeholder="e.g. DERIVATIVES · FLOW · GREEKS" style="text-transform:uppercase"></div>'+
'<div class="fld"><label>Description</label><textarea id="fDesc" placeholder="What does this department do, and how does it make the org smarter?"></textarea></div>';
var sheet=document.getElementById("sheet");sheet.innerHTML=sheetHTML("＋ New Department",cur.name+" · SAVED TO ORG MEMORY",f,"Create Department");
document.getElementById("modal").classList.add("on");
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("mSave").onclick=function(){
var name=document.getElementById("fName").value.trim();
if(!name){toast("Name is required");return}
if(cur.depts.some(function(d){return d.name.toLowerCase()===name.toLowerCase()})){toast("That department already exists here");return}
CUSTOM.depts.push({div:cur.key,name:name,sub:(document.getElementById("fSub").value.trim()||"CUSTOM DEPARTMENT").toUpperCase(),desc:document.getElementById("fDesc").value.trim()});
saveCustom();applyCustom();cur=DIVISIONS.find(function(d){return d.key===cur.key});
closeModal();render();toast(name+" created — add its first agent")}}

function closeModal(){document.getElementById("modal").classList.remove("on")}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});

/* ============ AGENT DETAIL ============ */
function findAgent(id){for(var i=0;i<cur.depts.length;i++){for(var j=0;j<cur.depts[i].agents.length;j++){if(cur.depts[i].agents[j].id===id)return cur.depts[i].agents[j]}}return null}
function openAgent(id){var a=findAgent(id);if(!a)return;curAgent=a;var s=stats(a);
var stTag=a.status==="RUNNING"?'<span class="badge run">RUNNING</span>':(a.status==="HUMAN"?'<span class="badge" style="color:var(--purple-hi);border-color:var(--purple)">◆ HUMAN SEAT</span>':'<span class="badge stb">ON-DEMAND</span>');
var up=a.status==="RUNNING"?s.upD+"D "+s.upH+"H "+s.upM+"M":"—";
var html='<div class="ov-top"><div class="ov-icon">'+cur.em+'</div><div style="min-width:0;flex:1">'+
'<div class="ov-name">'+esc(a.id)+'</div><div class="badges">'+stTag+'<span class="badge">UPTIME <b>'+up+'</b></span>'+
'<span class="badge">⤵ HEALTH <b>'+s.health+'%</b></span><span class="badge">🛡 CONFIDENCE <b>'+s.conf+'%</b></span></div></div>'+
'<div class="ov-x" id="ovX">✕</div></div>';
var tl=tiles(a);
html+='<div class="tiles">'+tl.map(function(t,i){var b="";
if(t[2]){if(t[2].live)b='<span class="bdg live">LIVE</span>';else if(t[2].n)b='<span class="bdg'+(t[2].red?" red":"")+'">'+t[2].n+'</span>'}
return '<div class="tile'+(i===0?" on":"")+'" data-t="'+t[1]+'"><span class="em">'+t[0]+'</span><span class="t">'+t[1]+'</span>'+b+'</div>'}).join("")+'</div>';
html+='<div class="panel"><div class="ph" id="pTitle">OVERVIEW</div><div class="pc" id="pBody">'+panelContent(a,"OVERVIEW")+'</div></div>';
html+='<div class="statgrid"><div class="stat"><div class="k">Current Task</div><div class="v green">'+task(a)+'</div></div>'+
'<div class="stat"><div class="k">Last Update</div><div class="v">'+s.last+' min ago</div></div>'+
'<div class="stat"><div class="k">Next Synthesis</div><div class="v">'+s.synth+'</div></div>'+
'<div class="stat"><div class="k">Active Mode</div><div class="v">'+s.mode+'</div></div></div>';
html+='<div class="box"><div class="k">Role</div><div class="v">'+esc(a.role)+'</div></div>';
html+='<div class="box"><div class="k">Division · Team</div><div class="v">'+cur.name+'<div class="sm" style="margin-top:4px">'+esc(curDeptName(a))+'</div></div></div>';
html+='<div class="chips"><button class="chip">⚡ Quick Brief</button><button class="chip">🕒 Recent Activity</button><button class="chip">👥 Team Sync</button><button class="chip">📄 Generate Report</button>'+
(a.custom?'<button class="chip danger" id="retireBtn">🗑 Retire Agent</button>':"")+'</div>';
html+='<div class="chatlog" id="chatlog">'+((CHATS[a.id]||[]).map(function(m){
return m[0]==="you"?'<div class="msg you">'+esc(m[1])+'</div>':'<div class="msg agt"><span class="who">'+esc(a.id)+'</span>'+esc(m[1])+'</div>'}).join(""))+'</div>';
var el=document.getElementById("ovIn");el.innerHTML=html;
document.getElementById("ov").classList.add("on");
document.getElementById("chatbar").classList.add("on");
document.body.style.overflow="hidden";document.getElementById("ov").scrollTop=0;
document.getElementById("ovX").onclick=closeAgent;
bindPanel(a);
el.querySelectorAll(".tile").forEach(function(t){t.onclick=function(){
el.querySelectorAll(".tile").forEach(function(x){x.classList.remove("on")});t.classList.add("on");
var name=t.getAttribute("data-t");document.getElementById("pTitle").textContent=name;
document.getElementById("pBody").innerHTML=panelContent(a,name);
bindPanel(a);
if(name==="CHAT")document.getElementById("chatIn").focus()}});
el.querySelectorAll(".chip").forEach(function(c){if(c.id!=="retireBtn")c.onclick=function(){toast(c.textContent.trim()+" — queued for "+a.id)}});
var rb=document.getElementById("retireBtn");
if(rb)rb.onclick=function(){
if(armed!==("a:"+a.id)){armed="a:"+a.id;rb.textContent="🗑 Tap again to confirm";setTimeout(function(){armed=null;rb.textContent="🗑 Retire Agent"},2500);return}
armed=null;retireAgent(a)}}
function closeAgent(){document.getElementById("ov").classList.remove("on");
document.getElementById("chatbar").classList.remove("on");document.body.style.overflow="";curAgent=null}

/* ============ CHAT ============ */
function reply(a,msg){var s=stats(a);
var lines=["Logged. Current focus: "+task(a).toLowerCase()+". Full readout at the "+s.synth+" synthesis.",
"Understood — I'll fold that into my next pass and note it in org memory.",
"On it. Confidence currently "+s.conf+"% on my active read; I'll flag if that shifts.",
"Received. If this needs structural change it goes to Mission Control as a proposal — otherwise I'll handle it inside my mandate."];
return lines[(h(a.id+msg)>>2)%lines.length]}
document.getElementById("sendBtn").onclick=sendMsg;
document.getElementById("chatIn").addEventListener("keydown",function(e){if(e.key==="Enter")sendMsg()});
function sendMsg(){var inp=document.getElementById("chatIn");var v=inp.value.trim();if(!v||!curAgent)return;
var log=document.getElementById("chatlog");var a=curAgent;
if(!CHATS[a.id])CHATS[a.id]=[];
CHATS[a.id].push(["you",v]);
log.insertAdjacentHTML("beforeend",'<div class="msg you">'+esc(v)+'</div>');inp.value="";
setTimeout(function(){if(curAgent!==a)return;var r=reply(a,v);
CHATS[a.id].push(["agt",r]);
if(CHATS[a.id].length>20)CHATS[a.id]=CHATS[a.id].slice(-20);
saveChats();
log.insertAdjacentHTML("beforeend",'<div class="msg agt"><span class="who">'+esc(a.id)+'</span>'+esc(r)+'</div>');
document.getElementById("ov").scrollTo({top:1e6,behavior:"smooth"})},650);
if(CHATS[a.id].length>20)CHATS[a.id]=CHATS[a.id].slice(-20);
saveChats();
document.getElementById("ov").scrollTo({top:1e6,behavior:"smooth"})}

/* ============ MISC ============ */
var toastT;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on")},2000)}
document.getElementById("q").addEventListener("input",function(){render()});

init();
</script>
</body>
</html>
