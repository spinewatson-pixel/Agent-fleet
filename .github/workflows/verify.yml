name: verify

# Verification runs on every push and pull request so it never depends on a
# developer remembering. Any deployment job must declare `needs: verify` — when
# a required gate fails this job exits non-zero and nothing downstream runs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Baselines are committed; full history is not needed, but the file is.
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify every registered ecosystem
        run: pnpm verify

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: .verification/reports/
          if-no-files-found: warn
          retention-days: 30
