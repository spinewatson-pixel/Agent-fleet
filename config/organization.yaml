# Institutional Agent Fleet — Organization Configuration
# LIVE EXECUTION IS DISABLED until Phase 5+ explicit authorization.

environment: paper  # paper | experimental | production (production execution gated)
live_execution_enabled: false
paper_capital_usd: 1_000_000

organization:
  name: Agent Fleet Institutional Trading Organization
  version: "0.1.0"
  chief_architecture_agent: ARCH-CHIEF-001

departments:
  systems_intelligence:
    inspired_by: Palantir
    supervisor: SYS-INTEL-001
    role: decision-system mapping, lineage, permissions, audit
  market_information:
    inspired_by: Bloomberg
    supervisor: MKT-INFO-001
    role: market data, news, filings, calendars, normalization
  ai_infrastructure:
    inspired_by: NVIDIA
    supervisor: AI-INFRA-001
    role: compute, model routing, latency, failover
  portfolio_risk:
    inspired_by: BlackRock
    supervisor: PORT-RISK-001
    role: portfolio construction, exposure, stress, drawdown
  trading_operations:
    inspired_by: Citadel
    supervisor: TRADE-OPS-001
    role: execution workflow, OMS, slippage, multi-strategy coord
  quantitative_research:
    inspired_by: Renaissance Technologies
    supervisor: QUANT-RES-001
    role: hypothesis, features, validation, anti-overfit
  research_strategy:
    inspired_by: Goldman Sachs
    supervisor: FUND-RES-001
    role: fundamental/sector/macro/event research → signals
  governance_operations:
    inspired_by: JPMorgan Chase
    supervisor: GOV-OPS-001
    role: controls, compliance, reconciliation, escalation
  capital_stewardship:
    inspired_by: Berkshire Hathaway
    supervisor: CAP-STEW-001
    role: long-term quality, valuation discipline, activity veto

risk_limits:
  max_gross_exposure_pct: 100
  max_net_exposure_pct: 60
  max_single_name_pct: 5
  max_sector_pct: 25
  max_strategy_pct: 30
  max_correlated_cluster_pct: 40
  daily_loss_halt_pct: 2
  drawdown_halt_pct: 8
  max_orders_per_day: 50
  min_liquidity_adv_pct: 2  # max order size as % of ADV

approval_chain:
  - strategy_proposal
  - independent_validation
  - portfolio_evaluation
  - risk_approval
  - capital_stewardship_review  # veto on unnecessary activity / low-quality risk
  - governance_check
  - execution_authorization

strategy_agents:
  - STRAT-MOM-001
  - STRAT-MR-001
  - STRAT-EARN-001
  - STRAT-MACRO-001
  - STRAT-FACTOR-001
  - STRAT-VALUE-001
  - STRAT-VOL-001
  - STRAT-SECTOR-001
